<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist de Produtos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 {
      text-align: center;
    }
    .item {
      background: #1e293b;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item label {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .checked span {
      text-decoration: line-through;
      opacity: 0.6;
    }
    .divider {
      margin: 20px 0;
      text-align: center;
      opacity: 0.6;
    }
    .info {
      background: #1e293b;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 14px;
    }
    .footer {
      margin-top: auto;
      text-align: center;
      font-size: 12px;
      opacity: 0.6;
      padding-top: 20px;
    }
    .product-link {
      margin-top: 8px;
      text-align: center;
    }
    .product-link a {
      color: #3b82f6;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>🛒 Checklist de Produtos</h1>

<div class="item">
  <label><input type="checkbox" onchange="toggle(this)"> 🧀 Mussarela (400g)</label>
  <div class="product-link">
    <a href="https://drive.google.com/file/d/1URPo0gjRO0lIJ9VrV4sbXp2WIF4Qp5PC/view?usp=sharing" target="_blank">Ver produto similar</a>
  </div>
</div>

<div class="divider">_________</div>

<div class="info">
  📌 Obs: Favor somar os itens e enviar o valor pelo WhatsApp
</div>

<div class="divider">_________</div>

<div class="info">
  📍 Endereço: Rua xxxxx
</div>

<div class="divider">_________</div>

<div class="info">
  ⚠️ Importante: Chamar no portão (Billy)
</div>

<div class="footer">
  © 2026 Billy Corp. All rights reserved.
</div>

<script>
  function toggle(el) {
    el.parentElement.classList.toggle('checked');
  }
</script>

</body>
</html>
