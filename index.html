<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checklist de Produtos</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  padding:20px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

h1{
  text-align:center;
  margin-bottom:25px;
  font-size:28px;
}

.item{
  background:#1e293b;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  transition:0.25s;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:0 0 15px rgba(0,0,0,0.15);
}

.item:hover{
  transform:translateY(-2px);
}

.item label{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:16px;
  cursor:pointer;
}

.item input[type="checkbox"]{
  width:18px;
  height:18px;
  cursor:pointer;
}

.checked{
  opacity:0.55;
}

.checked label{
  text-decoration:line-through;
}

.product-image{
  margin-top:14px;
  text-align:center;
}

.product-image img{
  width:220px;
  max-width:100%;
  border-radius:14px;
  transition:0.3s;
  box-shadow:0 0 20px rgba(0,0,0,0.35);
}

.product-image img:hover{
  transform:scale(1.02);
}

.product-link{
  margin-top:14px;
  display:flex;
  justify-content:center;
}

.product-link a{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:white;
  text-decoration:none;
  padding:12px 18px;
  border-radius:12px;
  font-size:14px;
  font-weight:bold;
  transition:0.25s;
  box-shadow:0 0 15px rgba(37,99,235,0.35);
}

.product-link a:hover{
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(59,130,246,0.55);
}

.divider{
  text-align:center;
  opacity:0.3;
  margin:20px 0;
  letter-spacing:3px;
}

.info{
  background:#1e293b;
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
  line-height:1.5;
  border:1px solid rgba(255,255,255,0.05);
}

.footer{
  margin-top:auto;
  padding-top:30px;
  text-align:center;
  font-size:12px;
  opacity:0.55;
  border-top:1px solid rgba(255,255,255,0.08);
}

</style>
</head>

<body>

<h1>🛒 Checklist de Produtos</h1>

<div class="item">

<label>
<input type="checkbox" onchange="toggle(this)">
🧀 Mussarela (400g)
</label>

<div class="product-image">
<img
src="https://drive.google.com/uc?export=view&id=1URPo0gjRO0lIJ9VrV4sbXp2WIF4Qp5PC"
alt="Produto Similar">
</div>

<div class="product-link">
<a
href="https://drive.google.com/uc?export=view&id=1URPo0gjRO0lIJ9VrV4sbXp2WIF4Qp5PC"
target="_blank">
🔍 Ver Produto Similar
</a>
</div>

</div>

<div class="item">
<label>
<input type="checkbox" onchange="toggle(this)">
🍌 Banana (1kg)
</label>
</div>

<div class="item">
<label>
<input type="checkbox" onchange="toggle(this)">
🍫 Choco Trio Garoto (2)
</label>
</div>

<div class="item">
<label>
<input type="checkbox" onchange="toggle(this)">
🍫 Biz (1)
</label>
</div>

<div class="item">
<label>
<input type="checkbox" onchange="toggle(this)">
🥚 Ovos (12)
</label>
</div>

<div class="item">
<label>
<input type="checkbox" onchange="toggle(this)">
🍋 Limões (5)
</label>
</div>

<div class="item">
<label>
<input type="checkbox" onchange="toggle(this)">
🍪 Biscoito Bauducco (1)
</label>
</div>

<div class="item">
<label>
<input type="checkbox" onchange="toggle(this)">
🥬 Alface (1)
</label>
</div>

<div class="item">
<label>
<input type="checkbox" onchange="toggle(this)">
🌺 Hibisco (200g)
</label>
</div>

<div class="divider">
────────────
</div>

<div class="info">
📌 Obs: Favor somar os itens e enviar o valor pelo WhatsApp
</div>

<div class="divider">
────────────
</div>

<div class="info">
📍 Endereço: Rua xxxxx
</div>

<div class="divider">
────────────
</div>

<div class="info">
⚠️ Importante: Chamar no portão (Billy)
</div>

<div class="footer">
©️ 2026 Billy Corp. All rights reserved.
</div>

<script>

function toggle(el){
  el.closest('.item').classList.toggle('checked');
}

</script>

</body>
</html>
